[project]
name = "median"
version = "0.1.0"
description = "Local demo that recommends movies and books across media."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "streamlit>=1.40",
    "anthropic>=0.40",
    "openai>=1.50",
    "sqlite-vec==0.1.9",  # pre-1.0: pinned exactly (docs/decisions/0001)
    "pydantic>=2.8",
    "httpx>=0.27",
    "tenacity>=9.0",
    "rapidfuzz>=3.9",
    "python-dotenv>=1.0",
    "SPARQLWrapper>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Installing the repo editable puts median/, pipeline/ and app/ on sys.path, which is what lets
# `streamlit run app/Home.py` import `median` (Streamlit only adds app/ itself).
packages = ["median", "pipeline", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not eval'"
markers = [
    "eval: recommendation quality eval; reads the real DB (run with `pytest -m eval`)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
# Ruff 0.17 also reformats Python code fences inside Markdown, which mangles the docs.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
